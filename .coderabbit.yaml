# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-GB"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    branches:
      - "main"
      - "preprod"
    ignore_title_keywords:
      - "WIP"
      - "Draft"
  path_filters:
    - "!vendor/**"
    - "!public/build/**"
    - "!var/**"
    - "!composer.lock"
    - "!yarn.lock"

chat:
  auto_reply: true
