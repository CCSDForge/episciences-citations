services:
  epi-citations-httpd:
    container_name: epi-citations-httpd
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    restart: always
    volumes:
      - ./docker/apache/vhost.conf:/usr/local/apache2/conf/extra/episciences-citations.conf
      - .:/var/www/htdocs
      - ./data:/var/www/data
      - ./cache:/var/www/cache
      - ./logs:/var/www/logs
    ports:
      - "8081:80"
    depends_on:
      - epi-citations-php-fpm
    networks:
      epi-citations-network:
      epi-network:
        aliases:
          - citations-dev.episciences.org
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.epi-citations-httpd.loadbalancer.server.port=80"
      - "traefik.http.routers.epi-citations.rule=Host(`citations-dev.episciences.org`)"
      - "traefik.http.routers.epi-citations.entrypoints=websecure"
      - "traefik.http.routers.epi-citations.tls=true"
      - "traefik.http.routers.epi-citations.service=epi-citations-httpd"
    command: >
      /bin/sh -c "chown -R www-data:www-data /var/www/data /var/www/cache /var/www/logs && httpd-foreground"


  epi-citations-php-fpm:
    container_name: epi-citations-php-fpm
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    ports:
      - "9004:9004" # Xdebug
    restart: always
    volumes:
      - .:/var/www/htdocs
      - ./data:/var/www/data
      - ./cache:/var/www/cache
      - ./logs:/var/www/logs
      - ./docker/php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf
      - ./logs/xdebug.log:/var/www/logs
    env_file:
      - .env.local
    environment:
      - PHP_FPM_LISTEN_PORT=9000
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9005
      - APP_ENV=dev
      - APP_DEBUG=1
    expose:
      - "9000"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    extra_hosts:
      - "dev.episciences.org:host-gateway"
      - "manager-dev.episciences.org:host-gateway"
      - "oai-dev.episciences.org:host-gateway"
      - "data-dev.episciences.org:host-gateway"
      - "dev-new.episciences.org:host-gateway"
      - "api-dev.episciences.org:host-gateway"
    networks:
      - epi-citations-network
      - epi-network

networks:
  epi-citations-network:
    name: epi-citations-network
    driver: bridge
  epi-network:
    external: true